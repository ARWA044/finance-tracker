name: Django checks and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: disposable-ci-key-not-for-production
      DEBUG: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest pytest-django factory-boy
      - run: python manage.py check
      - run: python -m pytest -q expenses/tests
